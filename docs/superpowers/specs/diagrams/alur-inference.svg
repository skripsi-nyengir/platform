<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <filter id="s2" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Alur 2: Sensor → Inference → Alert</text>

  <!-- Step 1: Sensor -->
  <rect x="20" y="50" width="120" height="55" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5" filter="url(#s2)"/>
  <text x="80" y="74" text-anchor="middle" font-weight="700" fill="#166534">Sensor n1–n6</text>
  <text x="80" y="90" text-anchor="middle" fill="#4b5563" font-size="10">per menit</text>

  <line x1="140" y1="78" x2="185" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="162" y="70" text-anchor="middle" fill="#6b7280" font-size="9">MQTT</text>

  <!-- Step 2: EMQX -->
  <rect x="190" y="50" width="100" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#s2)"/>
  <text x="240" y="74" text-anchor="middle" font-weight="700" fill="#1e40af">EMQX</text>
  <text x="240" y="90" text-anchor="middle" fill="#4b5563" font-size="10">Broker</text>

  <line x1="290" y1="78" x2="335" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Step 3: Consumer -->
  <rect x="340" y="50" width="110" height="55" rx="8" fill="#fefce8" stroke="#fbbf24" stroke-width="1.5" filter="url(#s2)"/>
  <text x="395" y="72" text-anchor="middle" font-weight="700" fill="#92400e">Consumer</text>
  <text x="395" y="88" text-anchor="middle" fill="#4b5563" font-size="10">→ Redis write</text>

  <line x1="395" y1="105" x2="395" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Step 4: Redis -->
  <rect x="320" y="148" width="150" height="50" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#s2)"/>
  <text x="395" y="170" text-anchor="middle" font-weight="700" fill="#7e22ce">Redis</text>
  <text x="395" y="186" text-anchor="middle" fill="#4b5563" font-size="10">sensor:{id}:latest</text>

  <line x1="395" y1="198" x2="395" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="409" y="215" fill="#6b7280" font-size="9">poll (60s)</text>

  <!-- Step 5: Inference -->
  <rect x="200" y="228" width="390" height="60" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" filter="url(#s2)"/>
  <text x="395" y="250" text-anchor="middle" font-weight="700" fill="#9a3412">Inference Service</text>
  <text x="395" y="268" text-anchor="middle" fill="#4b5563" font-size="10">Window(30) → Normalize → ONNX → MSE score → score > θ ?</text>
  <text x="395" y="282" text-anchor="middle" fill="#9ca3af" font-size="9">every ~60s per device</text>

  <!-- Arrow to MySQL (conditional) -->
  <line x1="590" y1="258" x2="650" y2="258" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>
  <text x="620" y="250" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="600">score > θ</text>

  <!-- Step 6: MySQL Alert -->
  <rect x="655" y="233" width="170" height="50" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" filter="url(#s2)"/>
  <text x="740" y="255" text-anchor="middle" font-weight="700" fill="#991b1b">MySQL: alerts</text>
  <text x="740" y="271" text-anchor="middle" fill="#4b5563" font-size="10">INSERT (device, score, θ)</text>

  <!-- Arrow MySQL → Laravel Alert -->
  <line x1="740" y1="283" x2="740" y2="300" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="754" y="298" fill="#6b7280" font-size="9">→ Alerts page</text>

  <!-- Detail box -->
  <rect x="500" y="42" width="360" height="170" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#s2)"/>
  <text x="680" y="64" text-anchor="middle" font-weight="600" fill="#334155" font-size="11">Detail Inference Loop</text>
  <line x1="520" y1="70" x2="840" y2="70" stroke="#e2e8f0" stroke-width="1"/>
  <text x="520" y="90" fill="#475565" font-size="10">1. Baca Redis semua 6 device</text>
  <text x="520" y="110" fill="#475565" font-size="10">2. Update sliding window (30 titik)</text>
  <text x="520" y="130" fill="#475565" font-size="10">3. Normalisasi (mean/std dari training)</text>
  <text x="520" y="150" fill="#475565" font-size="10">4. ONNX inference → rekonstruksi</text>
  <text x="520" y="170" fill="#475565" font-size="10">5. MSE = mean((input - recon)²)</text>
  <text x="520" y="190" fill="#475565" font-size="10">6. MSE > threshold → INSERT alert</text>
</svg>
