<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <linearGradient id="sensorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="brokerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="consumerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="inferGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Arsitektur Sistem — IoT Anomaly Detection</text>

  <!-- IoT Sensors -->
  <rect x="280" y="50" width="340" height="58" rx="10" fill="url(#sensorGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="74" text-anchor="middle" font-weight="700" fill="#166534">IoT Sensors (n1–n6)</text>
  <text x="450" y="92" text-anchor="middle" fill="#4b5563" font-size="11">Suhu (°C) + RH (%), cadence per-menit</text>

  <!-- Arrow: Sensors → EMQX -->
  <line x1="450" y1="108" x2="450" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="131" fill="#6b7280" font-size="10">MQTT publish</text>
  <text x="464" y="142" fill="#6b7280" font-size="9" font-style="italic">/bpom/sensor/{id}</text>

  <!-- EMQX -->
  <rect x="280" y="148" width="340" height="52" rx="10" fill="url(#brokerGrad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="172" text-anchor="middle" font-weight="700" fill="#1e40af">EMQX (MQTT Broker)</text>
  <text x="450" y="188" text-anchor="middle" fill="#4b5563" font-size="11">Docker · port 1883 · Dashboard :18083</text>

  <!-- Arrow: EMQX → Consumer -->
  <line x1="450" y1="200" x2="450" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="225" fill="#6b7280" font-size="10">MQTT subscribe</text>

  <!-- Consumer Service -->
  <rect x="220" y="243" width="460" height="80" rx="10" fill="url(#consumerGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="267" text-anchor="middle" font-weight="700" fill="#92400e">Consumer Service (Python)</text>
  <text x="450" y="285" text-anchor="middle" fill="#4b5563" font-size="11">paho-mqtt + clickhouse-driver + redis</text>
  <rect x="260" y="294" width="380" height="22" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="450" y="309" text-anchor="middle" fill="#78350f" font-size="10">Parse JSON → Write Redis (latest) → Buffer ClickHouse (batch)</text>

  <!-- Arrow: Consumer → Redis -->
  <line x1="350" y1="323" x2="350" y2="393" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="364" y="358" fill="#6b7280" font-size="10">latest values</text>

  <!-- Arrow: Consumer → ClickHouse -->
  <line x1="550" y1="323" x2="670" y2="393" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="350" fill="#6b7280" font-size="10">batch INSERT</text>
  <text x="600" y="362" fill="#6b7280" font-size="9" font-style="italic">every 5s / 100 rows</text>

  <!-- Redis -->
  <rect x="240" y="396" width="220" height="58" rx="10" fill="url(#storeGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="418" text-anchor="middle" font-weight="700" fill="#7e22ce">Redis</text>
  <text x="350" y="434" text-anchor="middle" fill="#4b5563" font-size="10">sensor:{id}:latest</text>
  <text x="350" y="447" text-anchor="middle" fill="#9ca3af" font-size="9">TTL 5 min · JSON</text>

  <!-- ClickHouse -->
  <rect x="560" y="396" width="220" height="58" rx="10" fill="url(#storeGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="418" text-anchor="middle" font-weight="700" fill="#7e22ce">ClickHouse</text>
  <text x="670" y="434" text-anchor="middle" fill="#4b5563" font-size="10">sensor_data table</text>
  <text x="670" y="447" text-anchor="middle" fill="#9ca3af" font-size="9">Historical store · MergeTree</text>

  <!-- Arrow: Redis → Inference -->
  <line x1="350" y1="454" x2="450" y2="505" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="364" y="482" fill="#6b7280" font-size="10">poll (10s)</text>

  <!-- Arrow: Redis → Laravel -->
  <line x1="240" y1="425" x2="170" y2="640" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="175" y="540" fill="#6b7280" font-size="10">poll (10s)</text>
  <text x="175" y="552" fill="#6b7280" font-size="9" font-style="italic">latest sensor values</text>

  <!-- Inference Service -->
  <rect x="250" y="508" width="400" height="80" rx="10" fill="url(#inferGrad)" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="532" text-anchor="middle" font-weight="700" fill="#9a3412">Inference Service (Python + FastAPI)</text>
  <text x="450" y="548" text-anchor="middle" fill="#4b5563" font-size="11">onnxruntime + redis + pymysql</text>
  <rect x="290" y="557" width="320" height="22" rx="4" fill="#ffedd5" stroke="#fdba74" stroke-width="0.5"/>
  <text x="450" y="572" text-anchor="middle" fill="#7c2d12" font-size="10">Window(30) → ONNX infer → score > θ → alert</text>

  <!-- Arrow: Inference → MySQL -->
  <line x1="450" y1="588" x2="450" y2="640" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="618" fill="#6b7280" font-size="10">INSERT alert</text>

  <!-- MySQL -->
  <rect x="320" y="643" width="260" height="52" rx="10" fill="url(#dbGrad)" stroke="#f87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="667" text-anchor="middle" font-weight="700" fill="#991b1b">MySQL</text>
  <text x="450" y="683" text-anchor="middle" fill="#4b5563" font-size="10">alerts table · Laravel default DB</text>

  <!-- Arrow: MySQL → Laravel -->
  <line x1="450" y1="695" x2="450" y2="728" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="717" fill="#6b7280" font-size="10">Eloquent query</text>

  <!-- Laravel -->
  <rect x="180" y="730" width="540" height="70" rx="10" fill="url(#webGrad)" stroke="#4ade80" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="754" text-anchor="middle" font-weight="700" fill="#166534">Laravel 12 + React (Breeze)</text>
  <text x="450" y="770" text-anchor="middle" fill="#4b5563" font-size="11">Dashboard: 6 device cards · real-time polling</text>
  <text x="450" y="785" text-anchor="middle" fill="#4b5563" font-size="11">Alerts: table · filter · acknowledge/resolve · Auth</text>
</svg>
