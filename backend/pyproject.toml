[project]
name = "anomaly-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
  "sqlalchemy[asyncio]==2.0.51",
  "psycopg[binary]==3.3.2",
  "alembic==1.18.5",
  "numpy==2.4.6",
  "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
eda = [
  "numpy==2.4.6",
  "pandas==2.3.3",
  "matplotlib==3.11.0",
  "scipy==1.17.1",
  "statsmodels==0.14.6",
  "ruptures==1.1.10",
  "scikit-learn==1.9.0",
  "seaborn==0.13.2",
]
# Slack alert delivery. Versions match the pins already used by the eda and test
# groups, so the notifier introduces no version the repository does not already carry.
notifier = [
  "matplotlib==3.11.0",
  "httpx==0.28.1",
]
test = [
  "pytest==9.1.0",
  "httpx==0.28.1",
  "anyio==4.14.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not canonical'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "canonical: full-range parity tests requiring the frozen authority CSV",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[tool.setuptools.package-data]
anomaly_backend = ["fixtures/**/*.json"]

[tool.setuptools.packages.find]
include = ["anomaly_backend*", "anomaly_eda*", "anomaly_worker*"]
