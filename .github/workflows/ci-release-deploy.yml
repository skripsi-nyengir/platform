name: PR unit gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-unit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg17
        env:
          POSTGRES_DB: anomaly_ci
          POSTGRES_USER: anomaly
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anomaly -d anomaly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: anomaly_ci
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: ci-only
      EDA_TOOLCHAIN_ROLE: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e '.[test,notifier]'
      - name: Non-canonical pytest suite
        working-directory: backend
        run: |
          pytest -m 'not canonical' \
            --ignore-glob='tests/test_eda_*' \
            --ignore=tests/test_live_model.py \
            --ignore=tests/test_live_model_bootstrap.py \
            --ignore=tests/test_live_service.py
          pytest tests/test_eda_toolchain.py

  worker-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build worker test target
        run: docker build --target worker-test -t anomaly-worker-test -f backend/Dockerfile.cpu backend
      - name: Run worker test target
        run: docker run --rm anomaly-worker-test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  pr-unit-gate:
    name: pr-unit-gate
    if: always()
    needs: [backend, worker-cpu, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all unit lanes to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          WORKER_RESULT: ${{ needs.worker-cpu.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != success || "$WORKER_RESULT" != success || "$FRONTEND_RESULT" != success ]]; then
            echo "Required unit lane failed: backend=$BACKEND_RESULT worker=$WORKER_RESULT frontend=$FRONTEND_RESULT" >&2
            exit 1
          fi
      - name: Create PR unit gate evidence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --argjson workflow_run_id "$WORKFLOW_RUN_ID" \
            '{schema: 1, pr_number: $pr_number, head_sha: $head_sha, workflow_run_id: $workflow_run_id, result: "success"}' \
            > pr-unit-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-unit-gate-${{ github.event.pull_request.number }}
          path: pr-unit-gate.json
          retention-days: 30
