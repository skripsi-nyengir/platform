name: CI, release, images, and production deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg17
        env:
          POSTGRES_DB: anomaly_ci
          POSTGRES_USER: anomaly
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anomaly -d anomaly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: anomaly_ci
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: ci-only
      EDA_TOOLCHAIN_ROLE: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install pinned backend tools
        working-directory: backend
        run: |
          . ../.github/ci-tools.lock
          python -m pip install --disable-pip-version-check "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e '.[test]' "ruff==$RUFF_VERSION" "pyright==$PYRIGHT_VERSION"
      - name: Ruff
        run: . .github/ci-tools.lock && ruff check backend
      - name: Pyright
        run: . .github/ci-tools.lock && pyright -p backend/pyrightconfig.json backend/anomaly_backend backend/anomaly_worker backend/tests
      - name: Migration and seed smoke test
        working-directory: backend
        run: |
          alembic -c alembic.ini upgrade head
          python -m anomaly_backend.seed
      - name: Non-canonical pytest suite
        working-directory: backend
        run: |
          pytest -m 'not canonical' \
            --ignore-glob='tests/test_eda_*' \
            --ignore=tests/test_live_model.py \
            --ignore=tests/test_live_model_bootstrap.py \
            --ignore=tests/test_live_service.py
          pytest tests/test_eda_toolchain.py

  worker-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build worker test target
        run: docker build --target worker-test -t anomaly-worker-test -f backend/Dockerfile.cpu backend
      - name: Run worker test target
        run: docker run --rm anomaly-worker-test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, unit test, build, and verify production dist
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
          npm run test:production
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Full Chromium end-to-end suite
        working-directory: frontend
        run: npm run test:e2e

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned workflow linters
        run: |
          . .github/ci-tools.lock
          go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
      - name: Validate workflows and shell
        run: |
          . .github/ci-tools.lock
          "$(go env GOPATH)/bin/actionlint"
          docker run --rm -v "$PWD:/repo:ro" -w /repo "koalaman/shellcheck:v$SHELLCHECK_VERSION" scripts/ci/*.sh scripts/deploy/anomaly-platform-deploy scripts/deploy/anomaly-deploy-force-command scripts/deploy/install-vps.sh scripts/deploy/configure-github.sh scripts/deploy/tests/*.sh
      - name: Render CPU, production CPU, and GPU Compose contracts
        run: scripts/ci/render-compose-contracts.sh
      - name: Exercise deployment state machine with fake dependencies
        run: scripts/deploy/tests/deploy_test.sh

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, worker-cpu, frontend, contracts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    if: needs.release.outputs.release_created == 'true'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      manifest_artifact: release-manifest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile.cpu
          target: runtime
          push: true
          tags: |
            ghcr.io/skripsi-nyengir/platform-api:${{ needs.release.outputs.tag_name }}
            ghcr.io/skripsi-nyengir/platform-api:sha-${{ needs.release.outputs.sha }}
      - id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile.cpu
          target: worker
          push: true
          tags: |
            ghcr.io/skripsi-nyengir/platform-worker-cpu:${{ needs.release.outputs.tag_name }}
            ghcr.io/skripsi-nyengir/platform-worker-cpu:sha-${{ needs.release.outputs.sha }}
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/skripsi-nyengir/platform-web:${{ needs.release.outputs.tag_name }}
            ghcr.io/skripsi-nyengir/platform-web:sha-${{ needs.release.outputs.sha }}
      - name: Create immutable release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.release.outputs.tag_name }}
          COMMIT: ${{ needs.release.outputs.sha }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          jq -n \
            --arg release "$RELEASE" \
            --arg commit "$COMMIT" \
            --arg runtime "ghcr.io/skripsi-nyengir/platform-api@$RUNTIME_DIGEST" \
            --arg worker "ghcr.io/skripsi-nyengir/platform-worker-cpu@$WORKER_DIGEST" \
            --arg web "ghcr.io/skripsi-nyengir/platform-web@$WEB_DIGEST" \
            '{schema: 1, release: $release, commit: $commit, runtime: $runtime, worker: $worker, web: $web}' \
            > release-manifest.json
          jq -e '.commit | test("^[0-9a-f]{40}$")' release-manifest.json >/dev/null
          gh release upload "$RELEASE" release-manifest.json --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 7

  deploy-production:
    if: needs.release.outputs.release_created == 'true' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [release, publish-images]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manifest
      - name: Deploy immutable release through forced command
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy < release-manifest.json
