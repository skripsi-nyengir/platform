server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location = /health {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location = /ready {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }
}
